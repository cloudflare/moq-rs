[package]
name = "moq-transport"
description = "Media over QUIC"
authors = ["moq-rs contributors"]
repository = "https://github.com/cloudflare/moq-rs"
license = "MIT OR Apache-2.0"

version = "0.16.5"
edition = "2021"

keywords = ["quic", "http3", "webtransport", "media", "live"]
categories = ["multimedia", "network-programming", "web-programming"]


# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
bytes = "1"
thiserror = "1"
tokio = { version = "1", features = ["macros", "io-util", "sync", "time"] }
tracing = { workspace = true }
uuid = { version = "1", features = ["v4"] }

web-transport-trait = { workspace = true }
url = "2"

paste = "1"
futures = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_with = "3"

[target.'cfg(any(not(target_arch = "wasm32"), target_os = "wasi"))'.dependencies]
# Existing backend; construction and compatibility live at the transport seam.
web-transport-quinn = "0.11.8"

[target.'cfg(all(target_arch = "wasm32", not(target_os = "wasi")))'.dependencies]
# The retained browser backend predates web-transport-trait. Keep its existing
# adapter until browser transport injection can be validated independently.
web-transport = "0.10.4"

[dev-dependencies]
tracing-subscriber = { workspace = true }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "time"] }
# Loopback web_transport::Session for session-cleanup unit tests.
rcgen = "0.13"
# Needed so the loopback TLS handshake has an unambiguous rustls crypto
# provider when the workspace links both `ring` and `aws-lc-rs` (feature
# unification under `cargo test --workspace`).
rustls = { version = "0.23", features = ["aws_lc_rs"] }
