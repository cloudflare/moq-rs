name: pr

on:
  pull_request:
    branches: ["main"]

env:
  CARGO_TERM_COLOR: always

jobs:
  reuse:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: REUSE Compliance Check
        uses: fsfe/reuse-action@v5

  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v3

      # Install Rust with clippy/rustfmt
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          components: clippy, rustfmt

      # Make sure u guys don't write bad code
      - run: cargo test --verbose
      - run: cargo clippy --no-deps
      - run: cargo fmt --check

      # Check for unused dependencies
      - uses: bnjbvr/cargo-machete@main

  fuzz:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions-rust-lang/setup-rust-toolchain@v1
      # The fuzz crate is excluded from the workspace (cargo-fuzz manages its
      # own), so the build job above never compiles it. Check that the
      # harness still builds against the current parser; running the fuzzer
      # needs nightly and cargo-fuzz and stays a manual step. Not --locked:
      # release version bumps only update the workspace lockfile.
      - run: cargo check --bins
        working-directory: moq-relay-ietf/fuzz
